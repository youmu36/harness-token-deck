name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: uv run python scripts/check_publication.py --history
      - run: uv run python -m pytest -m "not slow and not desktop"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
